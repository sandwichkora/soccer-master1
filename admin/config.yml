backend:
  name: git-gateway
  branch: main
  login: false

auth:
  use_auth0: true
  auth0_domain: dev-npiunpv5pob3vrpp.us.auth0.com
  auth0_client_id: 3bM2XqwdDgvkTUwYJJj13sGEhYERn8kF

media_folder: "images/uploads"
public_folder: "/soccer-master1/images/uploads"

collections:
  - name: "sports_sections"
    label: "الأقسام الرياضية"
    folder: "content/sports"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "القسم", name: "section", widget: "select", options: [
          "الدوري المصري", "الأهلي", "الزمالك",
          "الدوري السعودي", "الدوري الكويتي", "الدوري القطري", "الدوري الإماراتي",
          "الدوري المغربي", "الدوري التونسي", "الدوري الجزائري",
          "الدوري الإنجليزي", "الدوري الإسباني", "الدوري الإيطالي", "الدوري الألماني", "الدوري الفرنسي",
          "محمد صلاح", "ليفربول",
          "كأس العالم", "كأس الأمم الأوروبية", "دوري أبطال أوروبا",
          "دوري أبطال آسيا", "بطولة الأمم الآسيوية",
          "دوري أبطال أفريقيا", "كأس الأمم الأفريقية", "الكونفدرالية الأفريقية",
          "الكؤوس المحلية"
        ] }
      - { label: "الملخص", name: "summary", widget: "text" }
      - { label: "المحتوى", name: "body", widget: "markdown" }

  - name: "matches"
    label: "نتائج المباريات"
    folder: "content/matches"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "الفريق الأول", name: "team1", widget: "string" }
      - { label: "الفريق الثاني", name: "team2", widget: "string" }
      - { label: "النتيجة", name: "score", widget: "string" }
      - { label: "تاريخ المباراة", name: "date", widget: "datetime" }

  - name: "standings"
    label: "ترتيب الفرق"
    folder: "content/standings"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم الفريق", name: "team", widget: "string" }
      - { label: "النقاط", name: "points", widget: "number" }
      - { label: "عدد المباريات", name: "games", widget: "number" }
      - { label: "المركز", name: "rank", widget: "number" }
