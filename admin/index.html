<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>تسجيل الدخول - Sandwich Kora</title>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f0f0f0;
        text-align: center;
        padding-top: 100px;
      }
      h2 {
        color: #333;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        margin: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #login {
        background-color: #0077cc;
        color: white;
      }
      #logout {
        background-color: #999;
        color: white;
      }
    </style>
  </head>
  <body>
    <h2>تسجيل الدخول إلى لوحة Sandwich Kora</h2>
    <button id="login">تسجيل الدخول باستخدام Auth0</button>
    <button id="logout" style="display:none;">تسجيل الخروج</button>

    <script>
      let auth0Client;

      async function initAuth0() {
        auth0Client = await createAuth0Client({
          domain: "dev-rp1upny5p0adb1rr.us.auth0.com",
          client_id: "3ZK7gQvYwU7U1Jj13s6ETNEw8zkF",
          redirect_uri: window.location.origin + "/admin/"
        });

        const isAuthenticated = await auth0Client.isAuthenticated();

        if (isAuthenticated) {
          document.getElementById("login").style.display = "none";
          document.getElementById("logout").style.display = "inline-block";
          const user = await auth0Client.getUser();
          console.log("مرحبًا، " + user.name);
        } else {
          const query = window.location.search;
          if (query.includes("code=") && query.includes("state=")) {
            await auth0Client.handleRedirectCallback();
            window.history.replaceState({}, document.title, "/admin/");
          }
        }
      }

      document.getElementById("login").addEventListener("click", () => {
        auth0Client.loginWithRedirect();
      });

      document.getElementById("logout").addEventListener("click", () => {
        auth0Client.logout({ returnTo: window.location.origin + "/admin/" });
      });

      initAuth0();
    </script>
  </body>
</html>
