[[redirects]]
  from = "/"
  to = "/soccer.html"
  status = 200

[[redirects]]
  from = "/old-news"
  to = "/news.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[error_page]]
  status = 404
  file = "/404.html"
